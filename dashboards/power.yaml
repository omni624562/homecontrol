# 手機用電儀表板
# 用法：設定 → 儀表板 → 新增儀表板 →「從頭開始」→ 打開它 → 右上角 ⋮ → 編輯儀表板
#      → ⋮ →「原始設定編輯器」→ 把整份貼上、儲存
# 新增插座時：
#   - 在它的房間加開關（照 tv 的樣子）；有計量或估算的再加功率（照 sensor.tv_current_consumption）
#   - 有計量或估算的，在兩張圖表裡各加一組
# 新增房間時：複製一整個房間區塊，把 group.room_living 和 living_off 換成新的名稱

title: 用電
views:
  - title: 用電
    path: power
    icon: mdi:flash
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 總覽
          # 有插座連不上超過 10 分鐘時才會出現
          - type: markdown
            content: >-
              <ha-alert alert-type="warning">連不上：{{ state_attr('sensor.plugs_offline', 'names') | join('、') }}</ha-alert>
            visibility:
              - condition: numeric_state
                entity: sensor.plugs_offline
                above: 0
            grid_options:
              columns: full
          - type: tile
            entity: sensor.plugs_power
            name: 目前總功率
          - type: tile
            entity: sensor.plugs_energy_daily
            name: 今日用電
          - type: tile
            entity: sensor.plugs_cost_daily
            name: 今日電費
          - type: tile
            entity: sensor.plugs_cost_monthly
            name: 本月電費
          - type: tile
            entity: script.plugs_all_off
            name: 全部關閉
            icon: mdi:power-plug-off
            color: red
            hide_state: true
            tap_action: &all_off
              action: perform-action
              perform_action: script.plugs_all_off
              confirmation:
                text: 要關閉所有插座嗎？（常開插座不會關）
            icon_tap_action: *all_off
          - type: tile
            entity: script.plugs_standby_off
            name: 關閉待機中的
            icon: mdi:power-sleep
            color: indigo
            hide_state: true
            tap_action: &standby_off
              action: perform-action
              perform_action: script.plugs_standby_off
            icon_tap_action: *standby_off

      # 房間：每個房間一區，最上面的「關閉○○」會跳過常開插座
      - type: grid
        cards:
          - type: heading
            heading: 客廳
            icon: mdi:sofa
          - type: tile
            entity: script.plugs_off
            name: 關閉客廳
            icon: mdi:power-plug-off
            color: red
            hide_state: true
            tap_action: &living_off
              action: perform-action
              perform_action: script.plugs_off
              data:
                group: group.room_living
              confirmation:
                text: 要關閉客廳的插座嗎？（常開插座不會關）
            icon_tap_action: *living_off
            grid_options:
              columns: full
          # 點圖示開關，點其他地方看詳細資料
          - type: tile
            entity: switch.tv
            name: 電視
            icon_tap_action:
              action: toggle
          - type: tile
            entity: sensor.tv_current_consumption
            name: 電視 功率
          - type: tile
            entity: switch.pc
            name: 電腦
            icon_tap_action:
              action: toggle
          - type: tile
            entity: sensor.pc_current_consumption
            name: 電腦 功率

      - type: grid
        cards:
          - type: heading
            heading: 臥室
            icon: mdi:bed
          - type: tile
            entity: script.plugs_off
            name: 關閉臥室
            icon: mdi:power-plug-off
            color: red
            hide_state: true
            tap_action: &bedroom_off
              action: perform-action
              perform_action: script.plugs_off
              data:
                group: group.room_bedroom
              confirmation:
                text: 要關閉臥室的插座嗎？（常開插座不會關）
            icon_tap_action: *bedroom_off
            grid_options:
              columns: full
          # 估算用電的插座：功率是固定瓦數
          - type: tile
            entity: switch.lamp
            name: 檯燈
            icon_tap_action:
              action: toggle
          - type: tile
            entity: sensor.lamp_current_consumption
            name: 檯燈 功率（估算）
          # 沒有計量也沒有估算的插座：只有開關
          - type: tile
            entity: switch.desk_speaker
            name: 喇叭
            icon_tap_action:
              action: toggle

      - type: grid
        cards:
          - type: heading
            heading: 每日用電（近 14 天）
          - type: statistics-graph
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.tv_total_consumption
                name: 電視
              - entity: sensor.pc_total_consumption
                name: 電腦
              - entity: sensor.lamp_total_consumption
                name: 檯燈（估算）
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: 功率（近 24 小時）
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.tv_current_consumption
                name: 電視
              - entity: sensor.pc_current_consumption
                name: 電腦
              - entity: sensor.lamp_current_consumption
                name: 檯燈（估算）
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: 夜間排程
          - type: entities
            entities:
              - entity: input_boolean.power_schedule
              - entity: input_datetime.power_night_off
              - entity: input_datetime.power_morning_on
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: 設定
          - type: entities
            entities:
              - entity: input_number.household_monthly_kwh
              - entity: sensor.power_price
                secondary_info: none
              - type: attribute
                entity: sensor.power_price
                attribute: season
                name: 目前季節
                icon: mdi:sun-thermometer
              - entity: input_number.standby_threshold
              - entity: input_number.overload_threshold
            grid_options:
              columns: full
