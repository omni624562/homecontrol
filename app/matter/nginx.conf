# Matterbridge 管理頁的門口（:8283）
#
# Matterbridge 自己的管理頁沒有密碼，只開在樹莓派本機 127.0.0.1:8284。
# 這裡把它開放到區網，但要先從插座 App（:8100）的連結進來拿到通行證（cookie）；
# 沒有通行證的直接送回插座 App。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8283;
    listen [::]:8283;

    # 問插座 App：這個瀏覽器有沒有通行證
    location = /_plughub_auth {
        internal;
        proxy_pass http://127.0.0.1:8100/api/matterbridge/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /_plughub_auth;
        error_page 401 = @to_plughub;

        proxy_pass http://127.0.0.1:8284;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # 管理頁用 WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_buffering off;
        client_max_body_size 200m;                    # 上傳外掛、備份
    }

    location @to_plughub {
        return 302 http://$host:8100/;
    }
}
